name: Build

# Verifies that the documentation site builds. Docusaurus is configured with
# onBrokenLinks/onBrokenAnchors set to "throw", so a broken internal link fails
# this check rather than shipping to the site.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      # Full history: the "Last updated" stamp on each page comes from that
      # file's last commit, which a shallow clone does not carry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check discovery files were generated
        run: |
          set -e
          for f in build/llms.txt build/llms-full.txt build/sitemap.xml build/robots.txt build/CNAME; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          # One section bundle and one per-page twin, as samples: both are written
          # by the same loops, so a break in either shows up here.
          for f in build/llms/workspaces.txt build/workspaces/create-a-workspace.md build/index.md; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          # Every page listed in llms.txt must have a Markdown twin. This is the
          # promise llms.txt makes to agents — that appending .md to any page URL
          # works — and it broke silently the last time it was only prose.
          missing=0
          while read -r route; do
            candidate="build${route%/}.md"
            [ "$route" = "/" ] && candidate="build/index.md"
            test -f "$candidate" || { echo "No Markdown twin for $route"; missing=1; }
          done < <(grep -oE '\(https://help\.carbonvoice\.app(/[^)]*)?\)' build/llms.txt \
                     | grep -vE '/llms(-full)?\.txt|/llms/' \
                     | sed -E 's#\(https://help\.carbonvoice\.app##; s#\)##' \
                     | sed -E 's#^$#/#' | sort -u)
          test "$missing" -eq 0 || exit 1
          echo "All discovery files present, every page has a Markdown twin."

      - name: Check every page advertises a twin that exists
        run: |
          set -e
          # The check above proves the twins were written. This one proves the
          # pages point at them: src/theme/DocItem/Layout adds the <link> by
          # wrapping a theme component, so a Docusaurus upgrade that moves that
          # component drops the tag from all 126 pages and breaks nothing loudly.
          #
          # It asserts the href resolves rather than counting tags, because
          # counting passes at 126/126 while every section landing page points at
          # `/ai/.md` — the trailing slash that markdownRoute() exists to strip.
          expected=$(find docs -name '*.md' -o -name '*.mdx' | wc -l)
          grep -rho 'type="text/markdown" href="[^"]*"' build --include='*.html' \
            | sed -E 's/.*href="([^"]*)".*/\1/' | sort -u > advertised.txt
          found=$(wc -l < advertised.txt)
          test "$found" -eq "$expected" || {
            echo "Expected $expected pages advertising a Markdown twin, found $found"
            exit 1
          }
          missing=0
          while read -r href; do
            test -f "build${href}" || { echo "Advertised but not built: $href"; missing=1; }
          done < advertised.txt
          rm -f advertised.txt
          test "$missing" -eq 0 || exit 1
          echo "$found pages advertise a Markdown twin, and all of them exist."
