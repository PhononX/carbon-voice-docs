name: Build

# Verifies that the documentation site builds. Docusaurus is configured with
# onBrokenLinks/onBrokenAnchors set to "throw", so a broken internal link fails
# this check rather than shipping to the site.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      # Full history: the "Last updated" stamp on each page comes from that
      # file's last commit, which a shallow clone does not carry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check discovery files were generated
        run: |
          set -e
          for f in build/llms.txt build/llms-full.txt build/sitemap.xml build/robots.txt build/CNAME; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          # One section bundle and one per-page twin, as samples: both are written
          # by the same loops, so a break in either shows up here.
          for f in build/llms/workspaces.txt build/workspaces/create-a-workspace.md build/index.md; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          # Every page listed in llms.txt must have a Markdown twin. This is the
          # promise llms.txt makes to agents — that appending .md to any page URL
          # works — and it broke silently the last time it was only prose.
          routes=$(grep -oE '\(https://help\.carbonvoice\.app(/[^)]*)?\)' build/llms.txt \
                     | grep -vE '/llms(-full)?\.txt|/llms/' \
                     | sed -E 's#\(https://help\.carbonvoice\.app##; s#\)##' \
                     | sed -E 's#^$#/#' | sort -u)
          count=$(printf '%s\n' "$routes" | grep -c . || true)
          twins=$(find build -name '*.md' | wc -l)
          echo "llms.txt lists $count pages; $twins Markdown twins on disk."
          # An extraction that matched nothing would leave the loop below with no
          # iterations and report success, so no pages at all is its own failure.
          if [ "$count" -eq 0 ]; then
            echo "No page routes found in llms.txt — this check is not covering anything."
            exit 1
          fi

          # The loop runs first because it names the offending page; the counts
          # only say that something is off.
          missing=0
          while read -r route; do
            candidate="build${route%/}.md"
            [ "$route" = "/" ] && candidate="build/index.md"
            test -f "$candidate" || { echo "No Markdown twin for $route"; missing=1; }
          done <<< "$routes"
          test "$missing" -eq 0 || exit 1

          # Every listed page has a twin. The reverse should hold too: a twin with
          # no entry in llms.txt is a page agents cannot discover.
          if [ "$count" -ne "$twins" ]; then
            echo "$twins twins exist for $count listed pages — some are unlisted."
            exit 1
          fi
          echo "All discovery files present, every page has a Markdown twin."
